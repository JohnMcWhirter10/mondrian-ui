name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Match the npm used to write package-lock.json locally
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:mondrian:ci
      - run: npm test -- --coverage
      - run: npm run build
